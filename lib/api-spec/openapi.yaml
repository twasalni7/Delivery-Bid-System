openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Monthly Commute Bidding System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: drivers
    description: Driver operations
  - name: requests
    description: Commute request operations
  - name: offers
    description: Offer operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register-client:
    post:
      operationId: clientRegister
      tags: [auth]
      summary: Register a new client account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRegisterBody"
      responses:
        "201":
          description: Client registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/login-client:
    post:
      operationId: clientLogin
      tags: [auth]
      summary: Login as client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientLoginBody"
      responses:
        "200":
          description: Client logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/login-driver:
    post:
      operationId: driverLogin
      tags: [auth]
      summary: Login as driver using mobile + loginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverLoginBody"
      responses:
        "200":
          description: Driver logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/login-admin:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Login as admin using loginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Admin logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /drivers:
    get:
      operationId: listDrivers
      tags: [drivers]
      summary: List all active drivers
      responses:
        "200":
          description: List of drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Driver"

  /drivers/me:
    get:
      operationId: getDriverMe
      tags: [drivers]
      summary: Get current driver profile (requires driver auth)
      responses:
        "200":
          description: Driver profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDetail"

  /drivers/{id}:
    get:
      operationId: getDriver
      tags: [drivers]
      summary: Get driver by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"

  /drivers/{id}/balance:
    patch:
      operationId: addDriverBalance
      tags: [drivers]
      summary: Add balance to driver (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBalanceBody"
      responses:
        "200":
          description: Updated driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"

  /drivers/{id}/transactions:
    get:
      operationId: getDriverTransactions
      tags: [drivers]
      summary: Get driver transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List commute requests
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, SELECTED, ACTIVE, COMPLETED]
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommuteRequest"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create a commute request (requires client auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestBody"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommuteRequest"

  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommuteRequest"
    patch:
      operationId: adminUpdateRequestByPath
      tags: [requests, admin]
      summary: Admin updates request status or reassigns selectedDriverId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [OPEN, SELECTED, ACTIVE, COMPLETED]
                selectedDriverId:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommuteRequest"
    delete:
      operationId: adminDeleteRequestByPath
      tags: [requests, admin]
      summary: Admin deletes a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /requests/{id}/status:
    patch:
      operationId: updateRequestStatus
      tags: [requests]
      summary: Update request status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusBody"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommuteRequest"

  /requests/{id}/select-offer:
    post:
      operationId: selectOffer
      tags: [requests]
      summary: Client selects an offer for their request (requires client auth)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectOfferBody"
      responses:
        "200":
          description: Offer selected, driver assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommuteRequest"

  /requests/{id}/offers:
    get:
      operationId: getRequestOffers
      tags: [offers]
      summary: Get all offers for a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"

  /offers:
    get:
      operationId: listOffers
      tags: [offers]
      summary: List all offers (admin)
      responses:
        "200":
          description: List of all offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"
    post:
      operationId: createOffer
      tags: [offers]
      summary: Driver submits an offer (requires driver auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfferBody"
      responses:
        "201":
          description: Offer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard statistics (admin only)
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get admin dashboard analytics (admin only)
      parameters:
        - in: query
          name: months
          schema:
            type: integer
            enum: [3, 6, 12]
            default: 12
          required: false
          description: Number of months to include in the analytics (3, 6, or 12)
        - in: query
          name: from
          schema:
            type: string
            format: date
          required: false
          description: Start date for custom date range (ISO date string, e.g. 2024-01-01). Overrides months when both from and to are provided.
        - in: query
          name: to
          schema:
            type: string
            format: date
          required: false
          description: End date for custom date range (ISO date string, e.g. 2024-03-31). Overrides months when both from and to are provided.
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"

  /admin/drivers:
    get:
      operationId: adminListDrivers
      tags: [admin]
      summary: List all drivers with full details (admin only)
      responses:
        "200":
          description: List of drivers with full details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriverDetail"
    post:
      operationId: adminCreateDriver
      tags: [admin]
      summary: Register a new driver (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateDriverBody"
      responses:
        "201":
          description: Driver created with auto-generated loginCode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDetail"

  /admin/drivers/{id}:
    get:
      operationId: adminGetDriver
      tags: [admin]
      summary: Get driver full details (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver full details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDetail"
    patch:
      operationId: adminUpdateDriver
      tags: [admin]
      summary: Update driver information (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateDriverBody"
      responses:
        "200":
          description: Updated driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDetail"
    delete:
      operationId: adminDeleteDriver
      tags: [admin]
      summary: Soft-delete driver (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/drivers/{id}/block:
    post:
      operationId: adminBlockDriver
      tags: [admin]
      summary: Block a driver (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverActionResponse"

  /admin/drivers/{id}/unblock:
    post:
      operationId: adminUnblockDriver
      tags: [admin]
      summary: Unblock a driver (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver unblocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverActionResponse"

  /admin/drivers/{id}/warn:
    post:
      operationId: adminWarnDriver
      tags: [admin]
      summary: Add warning to driver (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Warning added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverActionResponse"

  /admin/drivers/{id}/restore:
    post:
      operationId: adminRestoreDriver
      tags: [admin]
      summary: Restore a soft-deleted driver (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverActionResponse"

  /admin/drivers/{id}/balance:
    patch:
      operationId: adminUpdateDriverBalance
      tags: [admin]
      summary: Update driver balance (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBalanceBody"
      responses:
        "200":
          description: Updated driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDetail"

  /admin/drivers/{id}/regenerate-code:
    post:
      operationId: adminRegenerateDriverCode
      tags: [admin]
      summary: Regenerate driver login code (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New login code
          content:
            application/json:
              schema:
                type: object
                properties:
                  loginCode:
                    type: string
                required:
                  - loginCode

  /admin/clients:
    get:
      operationId: adminListClients
      tags: [admin]
      summary: List all clients (admin only)
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSummary"

  /admin/requests:
    get:
      operationId: adminListRequests
      tags: [admin]
      summary: List all requests with full phone (admin only)
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommuteRequest"

  /admin/requests/{id}:
    patch:
      operationId: adminUpdateRequest
      tags: [admin]
      summary: Update request status or reassign selectedDriverId (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [OPEN, SELECTED, ACTIVE, COMPLETED]
                selectedDriverId:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommuteRequest"
    delete:
      operationId: adminDeleteRequest
      tags: [admin]
      summary: Delete a request (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    DriverActionResponse:
      type: object
      description: Response from driver action endpoints (block, unblock, warn, restore)
      properties:
        message:
          type: string
        status:
          type: string
          enum: [ACTIVE, BLOCKED, DELETED]
          nullable: true
        warningCount:
          type: integer
          nullable: true
      required:
        - message

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [client, driver, admin]
        mobile:
          type: string
          nullable: true
        balance:
          type: number
          nullable: true
        status:
          type: string
          nullable: true
      required:
        - id
        - name
        - role

    ClientRegisterBody:
      type: object
      properties:
        name:
          type: string
        mobile:
          type: string
        password:
          type: string
      required:
        - name
        - mobile
        - password

    ClientLoginBody:
      type: object
      properties:
        mobile:
          type: string
        password:
          type: string
      required:
        - mobile
        - password

    DriverLoginBody:
      type: object
      properties:
        mobile:
          type: string
        loginCode:
          type: string
      required:
        - mobile
        - loginCode

    AdminLoginBody:
      type: object
      properties:
        loginCode:
          type: string
      required:
        - loginCode

    Driver:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        balance:
          type: number
        mobile:
          type: string
          nullable: true
          description: "null when caller is not authorized to see it"
        carType:
          type: string
          nullable: true
        nationality:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, BLOCKED, DELETED]
        warningCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - balance
        - status
        - warningCount

    DriverDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        mobile:
          type: string
          nullable: true
        loginCode:
          type: string
          nullable: true
        balance:
          type: number
        carType:
          type: string
          nullable: true
        nationality:
          type: string
          nullable: true
        age:
          type: integer
          nullable: true
        nationalId:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, BLOCKED, DELETED]
        warningCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - balance
        - status
        - warningCount

    AdminCreateDriverBody:
      type: object
      properties:
        name:
          type: string
        mobile:
          type: string
        carType:
          type: string
        nationality:
          type: string
        age:
          type: integer
        nationalId:
          type: string
      required:
        - name
        - mobile

    AdminUpdateDriverBody:
      type: object
      properties:
        name:
          type: string
        mobile:
          type: string
        carType:
          type: string
        nationality:
          type: string
        age:
          type: integer
        nationalId:
          type: string

    ClientSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        mobile:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - mobile

    AddBalanceBody:
      type: object
      properties:
        amount:
          type: number
      required:
        - amount

    CommuteRequest:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
          nullable: true
        homeLocation:
          type: string
        workLocation:
          type: string
        phone:
          type: string
          nullable: true
          description: null when caller is not authorized to see it
        phoneHidden:
          type: boolean
        numberOfPeople:
          type: integer
        workingDaysPerWeek:
          type: integer
        morningTime:
          type: string
        eveningTime:
          type: string
        status:
          type: string
          enum: [OPEN, SELECTED, ACTIVE, COMPLETED]
        selectedDriverId:
          type: integer
          nullable: true
        selectedDriver:
          $ref: "#/components/schemas/Driver"
          nullable: true
        createdAt:
          type: string
        offerCount:
          type: integer
          nullable: true
          description: number of offers submitted for this request
      required:
        - id
        - homeLocation
        - workLocation
        - phone
        - phoneHidden
        - numberOfPeople
        - workingDaysPerWeek
        - morningTime
        - eveningTime
        - status

    CreateRequestBody:
      type: object
      properties:
        homeLocation:
          type: string
        workLocation:
          type: string
        phone:
          type: string
        numberOfPeople:
          type: integer
        workingDaysPerWeek:
          type: integer
        morningTime:
          type: string
        eveningTime:
          type: string
      required:
        - homeLocation
        - workLocation
        - phone
        - numberOfPeople
        - workingDaysPerWeek
        - morningTime
        - eveningTime

    UpdateStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [OPEN, SELECTED, ACTIVE, COMPLETED]
      required:
        - status

    SelectOfferBody:
      type: object
      properties:
        offerId:
          type: integer
      required:
        - offerId

    Offer:
      type: object
      properties:
        id:
          type: integer
        driverId:
          type: integer
        requestId:
          type: integer
        price:
          type: number
        carType:
          type: string
          nullable: true
        nationality:
          type: string
          nullable: true
        driver:
          $ref: "#/components/schemas/Driver"
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - driverId
        - requestId
        - price

    CreateOfferBody:
      type: object
      properties:
        requestId:
          type: integer
        price:
          type: number
        carType:
          type: string
        nationality:
          type: string
      required:
        - requestId
        - price
        - carType
        - nationality

    Transaction:
      type: object
      properties:
        id:
          type: integer
        driverId:
          type: integer
        amount:
          type: number
        type:
          type: string
        createdAt:
          type: string
      required:
        - id
        - driverId
        - amount
        - type

    AdminStats:
      type: object
      properties:
        totalRequests:
          type: integer
        openRequests:
          type: integer
        selectedRequests:
          type: integer
        activeRequests:
          type: integer
        completedRequests:
          type: integer
        totalDrivers:
          type: integer
        totalOffers:
          type: integer
        totalClients:
          type: integer
      required:
        - totalRequests
        - openRequests
        - selectedRequests
        - activeRequests
        - completedRequests
        - totalDrivers
        - totalOffers
        - totalClients

    MonthlyRequestPoint:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
