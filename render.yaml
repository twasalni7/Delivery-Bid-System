services:
  - type: web
    name: delivery-bid-api
    env: node
    plan: standard
    branch: main
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm run build
    startCommand: corepack pnpm --dir artifacts/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: delivery_db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://sharq.it.com
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        sync: false
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_REST_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@twasalni.app

  - type: web
    name: delivery-bid-frontend
    env: static
    branch: main
    buildCommand: BASE_PATH=/ corepack pnpm --filter @workspace/delivery-bidding run build
    staticPublishPath: artifacts/delivery-bidding/dist/public
    envVars:
      - key: VITE_ONESIGNAL_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

databases:
  - name: delivery_db
    databaseName: delivery_bid_system
    user: delivery_user
    plan: standard
    region: ohio
